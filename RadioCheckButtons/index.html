<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Form Container */
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #4CAF50; /* Green accent */
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Grouping Inputs */
        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        /* Text Input Styling */
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }

        /* Radio and Checkbox Layout */
        .inline-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }

        .inline-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }

        input[type="radio"], input[type="checkbox"] {
            margin-right: 5px;
        }

        /* Register Button */
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50; /* Professional green */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registration Form</h2>
    
    <form action="#">
        <div class="input-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label>Gender:</label>
            <div class="inline-group">
                <label class="inline-item"><input type="radio" name="gender" value="male"> Male</label>
                <label class="inline-item"><input type="radio" name="gender" value="female" checked> Female</label>
            </div>
        </div>

        <div class="input-group">
            <label>Languages:</label>
            <div class="inline-group">
                <label class="inline-item"><input type="checkbox" name="lang" value="java"> Java</label>
                <label class="inline-item"><input type="checkbox" name="lang" value="python"> Python</label>
                <label class="inline-item"><input type="checkbox" name="lang" value="selenium" checked> Selenium</label>
            </div>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
