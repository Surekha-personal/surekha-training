<!DOCTYPE html>
<html>
<head>
<title>Waits Demo</title>

<style>

body{
font-family: Arial;
margin:40px;
}

button{
padding:8px 15px;
margin-right:10px;
cursor:pointer;
}

input{
display:block;
margin-top:10px;
padding:6px;
width:200px;
}

</style>

</head>

<body>

<h1>Waits Demo</h1>

<p>
Click the below buttons to display the textboxes.<br>
Textbox1 will be displayed after <b>5 seconds</b> and 
Textbox2 will be displayed after <b>10 seconds</b>
</p>

<button onclick="addTextbox1()">Add Textbox1</button>
<button onclick="addTextbox2()">Add Textbox2</button>

<h3>Show the textboxes here:</h3>

<div id="textboxArea"></div>

<script>

function addTextbox1(){

setTimeout(function(){

let input = document.createElement("input");
input.placeholder="Textbox1";

document.getElementById("textboxArea").appendChild(input);

},5000);

}

function addTextbox2(){

setTimeout(function(){

let input = document.createElement("input");
input.placeholder="Textbox2";

document.getElementById("textboxArea").appendChild(input);

},10000);

}

</script>

</body>
</html>
